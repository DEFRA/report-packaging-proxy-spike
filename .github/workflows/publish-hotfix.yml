name: Publish Hot Fix

on:
  workflow_dispatch:

concurrency:
  group: $${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and validate
        run: |
          dotnet tool restore
          dotnet restore spike-report-packaging-proxy.slnx
          dotnet csharpier check .
          dotnet build spike-report-packaging-proxy.slnx --no-restore --warnaserror
      - name: Run unit tests
        run: dotnet test tests/ReverseProxy.Tests/ReverseProxy.Tests.csproj --no-restore
      - name: Start local environment
        run: docker compose up --build -d --wait
      - name: Run integration tests
        run: dotnet test tests/ReverseProxy.IntegrationTests/ReverseProxy.IntegrationTests.csproj --no-restore
      - name: Docker compose logs
        if: always()
        run: docker compose logs
      - name: Stop local environment
        if: always()
        run: docker compose down -v --remove-orphans
      # Publishing is intentionally disabled until this service is ready to release.
      # - name: Publish Hot Fix
      #   uses: DEFRA/cdp-build-action/build-hotfix@main
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
