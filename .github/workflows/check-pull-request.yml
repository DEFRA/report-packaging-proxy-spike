name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore report-packaging-proxy-spike.slnx
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Build
        run: dotnet build report-packaging-proxy-spike.slnx --no-restore --warnaserror
      - name: Run unit tests
        run: dotnet test tests/ReverseProxy.Tests/ReverseProxy.Tests.csproj --no-restore
      - name: Start local environment
        run: docker compose up --build -d --wait
      - name: Run integration tests
        run: dotnet test tests/ReverseProxy.IntegrationTests/ReverseProxy.IntegrationTests.csproj --no-restore
      - name: Docker compose logs
        if: always()
        run: docker compose logs
      - name: Stop local environment
        if: always()
        run: docker compose down -v --remove-orphans
